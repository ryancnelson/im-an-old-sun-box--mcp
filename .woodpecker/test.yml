when:
  - event: push

steps:
  - name: pytest
    image: bash
    commands:
      - >
        ssh -o BatchMode=yes rcn-exa-01
        'set -eu;
        WORKDIR=/tmp/im-an-old-sun-box-mcp-ci;
        rm -rf "$WORKDIR";
        git clone --branch '"$CI_COMMIT_BRANCH"' --depth 1
        https://github.com/ryancnelson/im-an-old-sun-box--mcp.git "$WORKDIR";
        cd "$WORKDIR";
        ~/.local/bin/uv sync --extra test;
        ~/.local/bin/uv run pytest -q;
        rm -rf "$WORKDIR"'
