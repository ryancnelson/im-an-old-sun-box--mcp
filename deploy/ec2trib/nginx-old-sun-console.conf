# Include this inside nginx's http block after replacing the certificate paths
# and public server name. The application itself listens only on loopback.

server {
    listen 443 ssl;
    server_name old-sun.example.net;

    ssl_certificate     /etc/old-sun-console/tls/fullchain.pem;
    ssl_certificate_key /etc/old-sun-console/tls/privkey.pem;

    # The callback query contains a single-use OAuth code. Do not put it in an
    # access log.
    location = /auth/callback {
        access_log off;
        proxy_pass http://127.0.0.1:8765;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
    }

    location /ws/console {
        proxy_pass http://127.0.0.1:8765;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 1d;
    }

    location / {
        proxy_pass http://127.0.0.1:8765;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
