name: conformance

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --extra test
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y socat
      - if: runner.os == 'macOS'
        run: command -v socat || brew install socat
      - run: uv run pytest -q
      - run: node --test tests/console_directory.test.cjs
      - run: uv run python -m build
